name: Estagiário Automático 🤖

# 1. O Despertador: Quando essa automação deve rodar?
on:
  schedule:
    # O horário usa o formato "Cron" (Minuto, Hora, Dia, Mês, Dia da Semana)
    # 09:00 no fuso UTC significa 06:00 da manhã no horário de Brasília!
    - cron: '0 11,17,23 * * *' 
  workflow_dispatch: # Essa linha cria um botão para rodarmos manualmente quando quisermos testar!

jobs:
  cacar-vagas:
    runs-on: ubuntu-latest # Pede pro GitHub ligar um computador virtual com Linux (é de graça!)
    
    permissions:
      contents: write

    steps:
      - name: 📥 Baixando o código
        uses: actions/checkout@v4

      - name: 🐍 Preparando o ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Instalando as ferramentas (requirements.txt)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Rodando os robôs Caçadores de Vagas e Alerta
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB_BUSCA }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python busca_vagas.py
          python busca_programathor.py
          python alerta_telegram.py
          
      - name: 💾 Salvando (Commit & Push) das vagas novas
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add vagas.json
          # Se não tiver vaga nova, ele ignora o erro e segue a vida
          git commit -m "🤖 auto: atualiza lista de vagas diárias" || echo "Sem mudanças no arquivo JSON hoje."
          git push